version: "3.8"

services:
  frontend:
    container_name: pitstop_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

  backend:
    container_name: pitstop_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # align these with your FastAPI settings
      DATABASE_URL: postgresql+asyncpg://pitstop:password@db:5432/pitstopdb
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: pitstop_db
    environment:
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pitstopdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
